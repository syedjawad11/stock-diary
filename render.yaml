services:
  - type: web
    name: stock-diary
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODEL_BACKEND
        value: cloudflare
      - key: DB_PATH
        value: /tmp/diary.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
